name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: npm run test:host
      - run: PI1_HOST_PACKAGE="$PWD/node_modules/@earendil-works/pi-coding-agent" PI1_HOST_ENTRY=bundle npm run test:host
